<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Situation</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <h1>Situation</h1>
    <div class="topbar-controls">
      <a class="reporter-link" href="/api-usage">API usage</a>
      <a class="reporter-link" href="/report">Report position</a>
      <label class="refresh-control" for="refresh-interval">
        Refresh
        <select id="refresh-interval">
          <option value="500">500 ms</option>
          <option value="1000" selected>1 s</option>
        </select>
      </label>
      <div class="status" aria-live="polite">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Checking</span>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="map" aria-label="Map area">
      <div id="map"></div>
      <div class="map-message" id="map-message">Loading world map…</div>
    </section>

    <aside class="activity">
      <h2>Target list</h2>
      <div class="tail-length">
        <label for="tail-length">Tail length <output id="tail-length-value">300 s</output></label>
        <input id="tail-length" type="range" min="5" max="300" step="5" value="300">
      </div>
      <label class="idle-threshold" for="idle-threshold">
        Idle after
        <span><input id="idle-threshold" type="number" min="1" step="1" value="300"> s</span>
      </label>
      <div class="target-tabs" role="tablist" aria-label="Target state">
        <button id="live-tab" type="button" role="tab" aria-selected="true" aria-controls="live-targets">
          Live <span id="live-count">0</span>
        </button>
        <button id="idle-tab" type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="idle-targets">
          Idle <span id="idle-count">0</span>
        </button>
      </div>
      <div id="live-targets" role="tabpanel" aria-labelledby="live-tab">
        <div class="activity-list" id="live-target-list"></div>
        <p class="empty-state" id="live-empty">No live targets.</p>
      </div>
      <div id="idle-targets" role="tabpanel" aria-labelledby="idle-tab" hidden>
        <div class="activity-list" id="idle-target-list"></div>
        <p class="empty-state" id="idle-empty">No idle targets.</p>
      </div>
      <p class="target-summary" id="position-summary">No targets reported.</p>
    </aside>
  </main>

  <script src="/pmtiles.js"></script>
  <script src="/milsymbol.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
