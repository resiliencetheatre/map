<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Situation</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <h1>Situation</h1>
    <div class="status" aria-live="polite">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Checking</span>
    </div>
  </header>

  <main class="workspace">
    <section class="map" aria-label="Map area">
      <div id="map"></div>
      <div class="map-message" id="map-message">Loading world map…</div>
    </section>

    <aside class="activity">
      <h2>Activity</h2>
      <div class="tail-length">
        <label for="tail-length">Tail length <output id="tail-length-value">300 s</output></label>
        <input id="tail-length" type="range" min="5" max="300" step="5" value="300">
      </div>
      <div id="activity-list">
        <div class="activity-item">
          <span class="activity-marker"></span>
          <div><strong>Waiting for positions</strong><time>Start the simulator</time></div>
        </div>
      </div>
      <p class="empty-state" id="position-summary">No live devices reported.</p>
    </aside>
  </main>

  <script src="/pmtiles.js"></script>
  <script src="/milsymbol.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
